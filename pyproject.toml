[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechmodel-bot"
version = "0.1.0"
description = "Automatisierter Trading-Bot nach dem PB-Blake-'Mech Model' (siehe docs/STRATEGY.md und docs/SPEC.md)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Broker-Anbindungen werden erst in M5/M6 ergänzt:
#   mt5    -> MetaTrader5 (nur Windows, läuft im Bridge-Dienst)
#   web    -> fastapi, uvicorn, argon2-cffi, ... (M7)

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
